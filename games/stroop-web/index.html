<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F0E8">
<title>색깔 헷갈림</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: one-screen portrait game, mirrors the Unity prototype (HUD / badge / word card / 2x2 options). Single light look by choice. */
:root {
  --bg: #F3F0E8; --ink: #2B2B2B; --sub: #7A746A; --card: #FFFFFF;
  --track: #DDD7CB; --meaning: #E8682B; --good: #2E9E44; --bad: #E53935;
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.app { height: 100%; max-width: 520px; margin: 0 auto; position: relative; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding-block: 16px; box-sizing: border-box; }

/* Title */
#title, #result { align-items: center; justify-content: center; gap: 20px; text-align: center; }
.logo { font-size: clamp(52px, 15vw, 76px); font-weight: 900; letter-spacing: -0.02em; line-height: 1; }
.eyebrow { font-size: 14px; font-weight: 700; letter-spacing: 0.24em; color: var(--sub); }
.rules { font-size: 17px; line-height: 1.7; max-width: 30ch; }
.rules b { font-weight: 900; }
.rules .m { color: var(--meaning); }
.small { font-size: 14px; color: var(--sub); }
.primary {
  font: 700 22px var(--font); color: #fff; background: var(--ink); border: 0;
  padding: 18px 0; width: min(320px, 100%); border-radius: 14px; box-shadow: 0 6px 0 rgba(0,0,0,.18);
  cursor: pointer;
}
.primary:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.18); }
.ghost { font: 700 17px var(--font); color: var(--ink); background: var(--card); border: 0; padding: 12px 28px; border-radius: 12px; cursor: pointer; }
button:focus-visible { outline: 3px solid var(--meaning); outline-offset: 3px; }

/* Game */
#game { gap: 12px; }
.hud { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; font-variant-numeric: tabular-nums; }
.hud .lv { font-weight: 700; color: var(--sub); font-size: 17px; }
.hud .score { font-weight: 900; font-size: 34px; }
.hud .time { font-weight: 700; color: var(--sub); font-size: 17px; text-align: right; }
.bar { height: 8px; background: var(--track); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 100%; background: var(--good); transform-origin: left; }
.combo { height: 24px; text-align: center; font-weight: 900; color: var(--meaning); font-size: 18px; }
.badge {
  align-self: center; color: #fff; background: var(--ink); font-size: 20px; font-weight: 500;
  padding: 12px 26px; border-radius: 999px; transition: background .15s;
}
.badge.meaning { background: var(--meaning); }
.badge b { font-weight: 900; }
.stage { position: relative; flex: 1 1 auto; min-height: 150px; display: flex; }
.card {
  flex: 1; background: var(--card); border-radius: 22px; box-shadow: 0 10px 0 rgba(0,0,0,.06);
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(72px, 24vw, 120px); font-weight: 900; letter-spacing: 0.04em;
}
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; font-weight: 900; }
#fb { font-size: 200px; opacity: 0; }
#cd { font-size: 150px; color: var(--ink); }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; flex: 0 0 auto; padding-bottom: 8px; }
.opt {
  font: 900 30px var(--font); color: var(--ink); background: var(--card); border: 0; border-radius: 16px;
  height: clamp(80px, 13vh, 116px); box-shadow: 0 6px 0 rgba(0,0,0,.12); cursor: pointer;
}
.opt:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.12); background: #EEE; }

/* Result */
.big { font-size: 84px; font-weight: 900; font-variant-numeric: tabular-nums; line-height: 1; }
.stats { background: var(--card); border-radius: 18px; padding: 18px 24px; width: min(320px, 100%); box-sizing: border-box; display: grid; gap: 8px; }
.stats div { display: flex; justify-content: space-between; font-size: 17px; font-variant-numeric: tabular-nums; }
.stats span:first-child { color: var(--sub); }
.stats span:last-child { font-weight: 700; }
.newbest { color: var(--meaning); font-weight: 900; }

.punch { animation: punch .14s ease-out; }
@keyframes punch { from { transform: scale(1.06); } to { transform: scale(1); } }
.shake { animation: shake .25s linear; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-14px)} 40%{transform:translateX(12px)} 60%{transform:translateX(-8px)} 80%{transform:translateX(4px)} }
.pop { animation: pop .35s ease-out forwards; }
@keyframes pop { 0%{opacity:1;transform:scale(.7)} 35%{transform:scale(1.12)} 60%{opacity:1} 100%{opacity:0;transform:scale(1.12)} }
.cdpop { animation: cdpop .25s ease-out; }
@keyframes cdpop { from{transform:scale(1.4)} to{transform:scale(1)} }
@media (prefers-reduced-motion: reduce) { .punch, .shake, .cdpop { animation: none; } }
</style>
</head>
<body>

<div class="app">
  <section class="screen" id="title">
    <div class="logo" id="logo"></div>
    <div class="eyebrow">STROOP TEST</div>
    <p class="rules">지시문을 잘 보고 답하세요!<br><br>
      <b>색깔</b> → 글자가 칠해진 색<br>
      <b class="m">뜻</b> → 글자가 의미하는 색<br><br>
      <span class="small">제한 시간 45초 · 오답 시 -1초</span></p>
    <button class="primary" id="startBtn">시작하기</button>
    <div class="small" id="titleBest"></div>
    <div class="small" id="fsHint">빈 곳을 누르면 전체화면 · 뒤로가기로 해제</div>
  </section>

  <section class="screen" id="game" hidden>
    <div class="hud"><span class="lv" id="lv">Lv.1</span><span class="score" id="score">0</span><span class="time" id="time">45</span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="combo" id="combo"></div>
    <div class="badge" id="badge" hidden></div>
    <div class="stage">
      <div class="card" id="card"></div>
      <div class="overlay" id="fb"></div>
      <div class="overlay" id="cd"></div>
    </div>
    <div class="options" id="options" hidden></div>
  </section>

  <section class="screen" id="result" hidden>
    <div class="eyebrow">결과</div>
    <div class="big" id="rScore">0</div>
    <div id="rBest" class="small"></div>
    <div class="stats" id="rStats"></div>
    <button class="primary" id="retryBtn">다시 하기</button>
    <button class="ghost" id="homeBtn">처음으로</button>
  </section>
</div>

<script>
// ─── Same rules as StroopLogic.cs ───
const PALETTE = [
  ["빨강", "#E53935"], ["파랑", "#1E63D6"], ["초록", "#2E9E44"],
  ["노랑", "#F2B705"], ["보라", "#8E3CC8"], ["검정", "#222222"],
];
const ROUND = 45, PENALTY = 1, PER_LEVEL = 5, MAX_LEVEL = 5, FEEDBACK_DELAY = 180, OPTION_COUNT = 4;
const INK = "ink", MEANING = "meaning";

function levelSettings(level) {
  let s;
  if (level <= 1) s = { colors: 4, meaning: 0, congruent: .25, interf: false };
  else if (level === 2) s = { colors: 4, meaning: .3, congruent: .2, interf: false };
  else if (level === 3) s = { colors: 5, meaning: .4, congruent: .2, interf: false };
  else if (level === 4) s = { colors: 5, meaning: .5, congruent: .15, interf: true };
  else s = { colors: 6, meaning: .5, congruent: .15, interf: true };
  s.colors = Math.min(s.colors, PALETTE.length);
  return s;
}
const rnd = n => Math.floor(Math.random() * n);
const rndExcept = (n, ex) => { const v = rnd(n - 1); return v >= ex ? v + 1 : v; };
function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; }

let last = null;
function nextQuestion(level) {
  const s = levelSettings(level), n = s.colors;
  let word, ink, guard = 0;
  do {
    word = rnd(n);
    ink = Math.random() < s.congruent ? word : rndExcept(n, word);
  } while (last && last.word === word && last.ink === ink && ++guard < 20);
  const type = Math.random() < s.meaning ? MEANING : INK;
  const answer = type === INK ? ink : word;
  const opts = [answer];
  if (word !== ink) opts.push(type === INK ? word : ink); // 함정 보기
  while (opts.length < Math.min(OPTION_COUNT, n)) { const c = rnd(n); if (!opts.includes(c)) opts.push(c); }
  shuffle(opts);
  const labelInk = opts.map(o => s.interf ? rndExcept(n, o) : -1);
  return (last = { word, ink, type, answer, opts, labelInk });
}
function scoreFor(comboAfter, rt) {
  const combo = Math.max(0, Math.min(comboAfter - 1, 10) * 10);
  const speed = rt < .8 ? 50 : rt < 1.2 ? 30 : rt < 1.8 ? 10 : 0;
  return 100 + combo + speed;
}

// ─── Game flow (same as StroopGame.cs) ───
const $ = id => document.getElementById(id);
const screens = { title: $("title"), game: $("game"), result: $("result") };
const show = name => Object.entries(screens).forEach(([k, el]) => el.hidden = k !== name);

let state = "title", q = null, timeLeft = ROUND, shownAt = 0, locked = true;
let score = 0, combo = 0, maxCombo = 0, correct = 0, wrong = 0, level = 1, rtSum = 0, lastFrame = 0;
let best = 0;
try { best = +localStorage.getItem("stroop.best") || 0; } catch (e) {}

$("logo").innerHTML = ["색", "깔", " ", "헷", "갈", "림"].map((ch, i) =>
  ch === " " ? " " : `<span style="color:${PALETTE[[0,1,0,2,3,4][i]][1]}">${ch}</span>`).join("");

const optBtns = [];
for (let i = 0; i < OPTION_COUNT; i++) {
  const b = document.createElement("button");
  b.className = "opt"; b.type = "button";
  b.addEventListener("pointerdown", e => { e.preventDefault(); answer(i); });
  b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); answer(i); } });
  $("options").appendChild(b); optBtns.push(b);
}
document.addEventListener("keydown", e => { if (state === "playing" && "1234".includes(e.key)) answer(+e.key - 1); });

function renderTitle() { $("titleBest").textContent = best > 0 ? `최고 기록  ${best.toLocaleString()}` : ""; show("title"); state = "title"; }

function start() {
  score = combo = maxCombo = correct = wrong = 0; rtSum = 0; level = 1; timeLeft = ROUND; last = null;
  $("card").textContent = ""; $("badge").hidden = true; $("options").hidden = true; $("fb").textContent = "";
  hud(); show("game"); state = "countdown";
  let n = 3;
  const tick = () => {
    if (state !== "countdown") return;
    if (n === 0) { $("cd").textContent = ""; play(); return; }
    const cd = $("cd"); cd.textContent = n; cd.classList.remove("cdpop"); void cd.offsetWidth; cd.classList.add("cdpop");
    n--; setTimeout(tick, 750);
  };
  tick();
}

function play() {
  state = "playing"; $("badge").hidden = false; $("options").hidden = false;
  ask(); lastFrame = performance.now(); requestAnimationFrame(loop);
}

function loop(t) {
  if (state !== "playing") return;
  timeLeft -= (t - lastFrame) / 1000; lastFrame = t;
  if (timeLeft <= 0) { timeLeft = 0; hud(); end(); return; }
  hud(); requestAnimationFrame(loop);
}

function ask() {
  q = nextQuestion(level);
  const badge = $("badge"), isInk = q.type === INK;
  badge.className = "badge" + (isInk ? "" : " meaning");
  badge.innerHTML = isInk ? "글자의 <b>색깔</b>을 고르세요" : "글자의 <b>뜻</b>을 고르세요";
  const card = $("card");
  card.textContent = PALETTE[q.word][0]; card.style.color = PALETTE[q.ink][1];
  card.classList.remove("punch", "shake"); void card.offsetWidth; card.classList.add("punch");
  optBtns.forEach((b, i) => {
    const used = i < q.opts.length; b.hidden = !used; if (!used) return;
    b.textContent = PALETTE[q.opts[i]][0];
    b.style.color = q.labelInk[i] >= 0 ? PALETTE[q.labelInk[i]][1] : "";
  });
  shownAt = performance.now(); locked = false;
}

function answer(i) {
  if (state !== "playing" || locked || !q || i >= q.opts.length) return;
  locked = true;
  const rt = (performance.now() - shownAt) / 1000, ok = q.opts[i] === q.answer;
  if (ok) {
    correct++; combo++; maxCombo = Math.max(maxCombo, combo); rtSum += rt;
    score += scoreFor(combo, rt);
    level = Math.min(MAX_LEVEL, 1 + Math.floor(correct / PER_LEVEL));
  } else {
    wrong++; combo = 0; timeLeft = Math.max(.01, timeLeft - PENALTY);
    const card = $("card"); card.classList.remove("punch", "shake"); void card.offsetWidth; card.classList.add("shake");
    try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
  }
  const fb = $("fb"); fb.textContent = ok ? "O" : "X"; fb.style.color = ok ? "var(--good)" : "var(--bad)";
  fb.classList.remove("pop"); void fb.offsetWidth; fb.classList.add("pop");
  hud();
  setTimeout(() => { if (state === "playing") ask(); }, FEEDBACK_DELAY);
}

function hud() {
  const r = Math.max(0, Math.min(1, timeLeft / ROUND));
  const bar = $("bar"); bar.style.transform = `scaleX(${r})`; bar.style.background = r > .2 ? "var(--good)" : "var(--bad)";
  $("time").textContent = Math.ceil(timeLeft);
  $("score").textContent = score.toLocaleString();
  $("combo").textContent = combo >= 2 ? `${combo} COMBO` : "";
  $("lv").textContent = `Lv.${level}`;
}

function end() {
  state = "result"; locked = true;
  const isNew = score > best && score > 0;
  if (isNew) { best = score; try { localStorage.setItem("stroop.best", best); } catch (e) {} }
  const total = correct + wrong;
  $("rScore").textContent = score.toLocaleString();
  $("rBest").innerHTML = isNew ? '<span class="newbest">신기록!</span>' : `최고 기록  ${best.toLocaleString()}`;
  $("rStats").innerHTML = [
    ["정답", `${correct} / ${total}`],
    ["정확도", `${total ? Math.round(correct / total * 100) : 0}%`],
    ["평균 반응 속도", `${correct ? (rtSum / correct).toFixed(2) : "0.00"}초`],
    ["최대 콤보", maxCombo],
  ].map(([k, v]) => `<div><span>${k}</span><span>${v}</span></div>`).join("");
  show("result");
}

// ─── 전체화면: 빈 곳 클릭 → 진입, 뒤로가기(또는 Esc) → 해제 ───
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
const fsSupported = !!(document.documentElement.requestFullscreen || document.documentElement.webkitRequestFullscreen);
function enterFullscreen() {
  const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req || fsEl()) return;
  // 전체화면 진입 시 히스토리를 하나 쌓아서, 뒤로가기가 페이지 이탈 대신 전체화면 해제가 되도록
  const pushed = () => { try { history.pushState({ stroopFs: true }, ""); } catch (e) {} };
  try { const p = req.call(el); p && p.then ? p.then(pushed, () => {}) : pushed(); } catch (e) {}
}
function exitFullscreen() {
  const exit = document.exitFullscreen || document.webkitExitFullscreen;
  if (!fsEl() || !exit) return;
  try { const p = exit.call(document); p && p.catch && p.catch(() => {}); } catch (e) {}
}
document.addEventListener("click", e => { if (!e.target.closest("button")) enterFullscreen(); });
window.addEventListener("popstate", () => { if (fsEl()) exitFullscreen(); });
function onFsChange() {
  // Esc 등 다른 방법으로 해제됐으면 쌓아둔 히스토리를 정리
  if (!fsEl() && history.state && history.state.stroopFs) history.back();
}
document.addEventListener("fullscreenchange", onFsChange);
document.addEventListener("webkitfullscreenchange", onFsChange);
$("fsHint").hidden = !fsSupported;

$("startBtn").addEventListener("click", start);
$("retryBtn").addEventListener("click", start);
$("homeBtn").addEventListener("click", renderTitle);
renderTitle();
</script>
</body>
</html>

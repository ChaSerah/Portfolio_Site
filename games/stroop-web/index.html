<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3F0E8">
<title>색깔 헷갈림</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500;700;900&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
/* Layout: 고령자용 한 화면 게임. 글자는 크게, 화면 요소는 최소로 (시간 막대 / 점수 / 지시문 / 단어 카드 / 고정된 2x2 버튼). */
:root {
  --bg: #F3F0E8; --ink: #222222; --sub: #4F4A43; --card: #FFFFFF;
  --track: #D9D2C4; --accent: #D9581E; --good: #2E9E44; --bad: #E53935;
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  color-scheme: light;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 22px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box; overflow: hidden;
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  touch-action: manipulation; -webkit-text-size-adjust: 100%; word-break: keep-all;
}
.app { height: 100%; max-width: 560px; margin: 0 auto; position: relative; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; padding-block: 16px; box-sizing: border-box; }
button { font-family: var(--font); cursor: pointer; border: 0; }
button:focus-visible { outline: 4px solid var(--accent); outline-offset: 4px; }

/* 공통 버튼 */
.primary {
  font-size: 32px; font-weight: 900; color: #fff; background: var(--ink);
  width: 100%; min-height: 88px; border-radius: 18px; box-shadow: 0 6px 0 rgba(0,0,0,.2);
}
.primary:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.2); }
.secondary {
  font-size: 26px; font-weight: 700; color: var(--ink); background: var(--card);
  width: 100%; min-height: 72px; border-radius: 18px; box-shadow: 0 5px 0 rgba(0,0,0,.1);
}
.secondary:active { transform: translateY(3px); box-shadow: 0 2px 0 rgba(0,0,0,.1); }

/* 시작 화면 */
#title, #result { justify-content: center; gap: 24px; text-align: center; }
.logo { font-size: clamp(64px, 19vw, 96px); font-weight: 900; letter-spacing: -0.02em; line-height: 1.05; }
.howto { font-size: 28px; font-weight: 700; line-height: 1.45; text-wrap: balance; }
.howto b { font-weight: 900; color: var(--accent); }
.example {
  background: var(--card); border-radius: 20px; padding: 18px 16px;
  display: flex; flex-direction: column; align-items: center; gap: 10px;
}
.example .w { font-size: 64px; font-weight: 900; color: #1E63D6; line-height: 1; }
.example .a { font-size: 30px; font-weight: 700; }
.example .a b { font-weight: 900; color: #1E63D6; }
.best { font-size: 24px; font-weight: 700; color: var(--sub); font-variant-numeric: tabular-nums; min-height: 1.2em; }

/* 게임 화면 */
#game { gap: 14px; }
.bar { height: 16px; background: var(--track); border-radius: 8px; overflow: hidden; flex: 0 0 auto; }
.bar i { display: block; height: 100%; width: 100%; background: var(--good); transform-origin: left; }
.score { text-align: center; font-size: 44px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
.score small { font-size: 24px; font-weight: 700; color: var(--sub); margin-right: 10px; vertical-align: 4px; }
.prompt { text-align: center; font-size: 30px; font-weight: 700; line-height: 1.2; }
.prompt b { font-weight: 900; color: var(--accent); }
.stage { position: relative; flex: 1 1 auto; min-height: 160px; display: flex; }
.card {
  flex: 1; background: var(--card); border-radius: 24px; box-shadow: 0 10px 0 rgba(0,0,0,.06);
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(100px, 32vw, 170px); font-weight: 900; letter-spacing: 0.04em; line-height: 1;
}
.overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; font-weight: 900; }
#fb { font-size: 220px; opacity: 0; }
#cd { font-size: 170px; color: var(--ink); }
.qbar { height: 18px; background: var(--track); border-radius: 9px; overflow: hidden; flex: 0 0 auto; }
.qbar i { display: block; height: 100%; width: 100%; background: var(--ink); transform-origin: left; }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; flex: 0 0 auto; padding-bottom: 6px; }
.opt {
  font-size: 44px; font-weight: 900; color: var(--ink); background: var(--card); border-radius: 20px;
  height: clamp(96px, 15vh, 140px); box-shadow: 0 6px 0 rgba(0,0,0,.14);
}
.opt:active { transform: translateY(3px); box-shadow: 0 3px 0 rgba(0,0,0,.14); background: #ECE8E0; }

/* 결과 화면 */
.cheer { font-size: 38px; font-weight: 900; line-height: 1.25; text-wrap: balance; }
.final { display: flex; flex-direction: column; gap: 12px; }
.final .label { font-size: 26px; font-weight: 700; color: var(--sub); }
.final .big { font-size: 96px; font-weight: 900; line-height: 1.1; font-variant-numeric: tabular-nums; }
.newbest { color: var(--accent); font-weight: 900; }
.stats { background: var(--card); border-radius: 20px; padding: 20px 24px; display: grid; gap: 14px; }
.stats div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 26px; font-variant-numeric: tabular-nums; }
.stats span:first-child { color: var(--sub); font-weight: 700; }
.stats span:last-child { font-weight: 900; }
.btns { display: grid; gap: 14px; }

.punch { animation: punch .14s ease-out; }
@keyframes punch { from { transform: scale(1.05); } to { transform: scale(1); } }
.shake { animation: shake .25s linear; }
@keyframes shake { 0%,100%{transform:translateX(0)} 20%{transform:translateX(-14px)} 40%{transform:translateX(12px)} 60%{transform:translateX(-8px)} 80%{transform:translateX(4px)} }
.pop { animation: pop .35s ease-out forwards; }
@keyframes pop { 0%{opacity:1;transform:scale(.7)} 35%{transform:scale(1.12)} 60%{opacity:1} 100%{opacity:0;transform:scale(1.12)} }
.cdpop { animation: cdpop .25s ease-out; }
@keyframes cdpop { from{transform:scale(1.4)} to{transform:scale(1)} }
@media (prefers-reduced-motion: reduce) { .punch, .shake, .cdpop { animation: none; } }

/* 키가 작은 화면(작은 휴대폰)에서는 조금 줄여서 한 화면에 들어오게 */
@media (max-height: 700px) {
  #title, #result { gap: 16px; }
  .example .w { font-size: 52px; }
  .final .big { font-size: 80px; }
  .opt { height: 92px; font-size: 40px; }
  .prompt { font-size: 26px; }
  .score { font-size: 38px; }
}
</style>
</head>
<body>

<div class="app">
  <section class="screen" id="title">
    <div class="logo" id="logo"></div>
    <p class="howto" style="margin:0">글자를 읽지 말고<br>글자의 <b>색깔</b>을 누르세요</p>
    <div class="example" aria-label="예시: 파란색으로 쓰인 빨강은 파랑이 정답">
      <span class="w">빨강</span><span class="a">정답은 <b>파랑</b></span>
    </div>
    <button class="primary" id="startBtn" type="button">시작하기</button>
    <div class="best" id="titleBest"></div>
  </section>

  <section class="screen" id="game" hidden>
    <div class="bar" aria-hidden="true"><i id="bar"></i></div>
    <div class="score"><small>점수</small><span id="score">0</span></div>
    <div class="prompt" id="prompt" hidden>글자의 <b>색깔</b>을 누르세요</div>
    <div class="stage">
      <div class="card" id="card"></div>
      <div class="overlay" id="fb"></div>
      <div class="overlay" id="cd"></div>
    </div>
    <div class="qbar" id="qbarWrap" hidden aria-hidden="true"><i id="qbar"></i></div>
    <div class="options" id="options" hidden></div>
  </section>

  <section class="screen" id="result" hidden>
    <div class="cheer" id="cheer"></div>
    <div class="final">
      <span class="label">점수</span>
      <span class="big" id="rScore">0</span>
      <span class="best" id="rBest"></span>
    </div>
    <div class="stats" id="rStats"></div>
    <div class="btns">
      <button class="primary" id="retryBtn" type="button">다시 하기</button>
      <button class="secondary" id="homeBtn" type="button">처음으로</button>
    </div>
  </section>
</div>

<script>
// ─── 규칙 (StroopLogic.cs와 동일) ───
const PALETTE = [
  ["빨강", "#E53935"], ["파랑", "#1E63D6"], ["초록", "#2E9E44"], ["노랑", "#F2B705"],
];
// 색은 4가지 고정, "색깔" 문제만. 버튼 위치 고정.
// 난이도는 문제당 답할 수 있는 시간으로만 조절: 5초 → 정답 5개마다 -0.5초 → 최소 2초
const START_TIME = 5, TIME_STEP = .5, MIN_TIME = 2;
const ROUND = 45, PENALTY = 1, PER_LEVEL = 5, FEEDBACK_DELAY = 180;
const MAX_LEVEL = 1 + Math.round((START_TIME - MIN_TIME) / TIME_STEP);
const CONGRUENT = .2; // 글자와 색이 같은 쉬운 문제 비율

const answerLimit = level => Math.max(MIN_TIME, START_TIME - TIME_STEP * (level - 1));
const rnd = n => Math.floor(Math.random() * n);
const rndExcept = (n, ex) => { const v = rnd(n - 1); return v >= ex ? v + 1 : v; };

let last = null;
function nextQuestion() {
  const n = PALETTE.length;
  let word, ink, guard = 0;
  do {
    word = rnd(n);
    ink = Math.random() < CONGRUENT ? word : rndExcept(n, word);
  } while (last && last.word === word && last.ink === ink && ++guard < 20);
  return (last = { word, ink, answer: ink });
}
function scoreFor(comboAfter, rt) {
  const combo = Math.max(0, Math.min(comboAfter - 1, 10) * 10);
  const speed = rt < .8 ? 50 : rt < 1.2 ? 30 : rt < 1.8 ? 10 : 0;
  return 100 + combo + speed;
}

// ─── 게임 흐름 ───
const $ = id => document.getElementById(id);
const screens = { title: $("title"), game: $("game"), result: $("result") };
const show = name => Object.entries(screens).forEach(([k, el]) => el.hidden = k !== name);

let state = "title", q = null, limit = START_TIME, timeLeft = ROUND, shownAt = 0, locked = true;
let score = 0, combo = 0, correct = 0, wrong = 0, level = 1, rtSum = 0, lastFrame = 0;
let best = 0;
try { best = +localStorage.getItem("stroop.best") || 0; } catch (e) {}

$("logo").innerHTML = ["색", "깔", "<br>", "헷", "갈", "림"].map((ch, i) =>
  ch === "<br>" ? ch : `<span style="color:${PALETTE[[0, 1, 0, 2, 3, 1][i]][1]}">${ch}</span>`).join("");

// 보기 버튼: 위치 고정 (빨강·파랑 / 초록·노랑)
const optBtns = PALETTE.map(([name], i) => {
  const b = document.createElement("button");
  b.className = "opt"; b.type = "button"; b.textContent = name;
  b.addEventListener("pointerdown", e => { e.preventDefault(); answer(i); });
  b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); answer(i); } });
  $("options").appendChild(b);
  return b;
});
document.addEventListener("keydown", e => { if (state === "playing" && "1234".includes(e.key)) answer(+e.key - 1); });

function renderTitle() {
  $("titleBest").textContent = best > 0 ? `최고 점수 ${best.toLocaleString()}` : "";
  show("title"); state = "title";
}

function start() {
  score = combo = correct = wrong = 0; rtSum = 0; level = 1; timeLeft = ROUND; last = null;
  $("card").textContent = ""; $("fb").textContent = "";
  $("prompt").hidden = $("options").hidden = $("qbarWrap").hidden = true;
  hud(); show("game"); state = "countdown";
  let n = 3;
  const tick = () => {
    if (state !== "countdown") return;
    if (n === 0) { $("cd").textContent = ""; play(); return; }
    const cd = $("cd"); cd.textContent = n; cd.classList.remove("cdpop"); void cd.offsetWidth; cd.classList.add("cdpop");
    n--; setTimeout(tick, 750);
  };
  tick();
}

function play() {
  state = "playing";
  $("prompt").hidden = $("options").hidden = $("qbarWrap").hidden = false;
  ask(); lastFrame = performance.now(); requestAnimationFrame(loop);
}

function loop(t) {
  if (state !== "playing") return;
  timeLeft -= (t - lastFrame) / 1000; lastFrame = t;
  if (timeLeft <= 0) { timeLeft = 0; hud(); end(); return; }
  // 문제당 제한 시간
  if (!locked && q) {
    const el = (t - shownAt) / 1000, r = Math.max(0, 1 - el / limit), qb = $("qbar");
    qb.style.transform = `scaleX(${r})`; qb.style.background = r > .3 ? "var(--ink)" : "var(--bad)";
    if (el >= limit) resolve(false, el);
  }
  hud(); requestAnimationFrame(loop);
}

function ask() {
  q = nextQuestion();
  limit = answerLimit(level);
  $("qbar").style.transform = "scaleX(1)"; $("qbar").style.background = "var(--ink)";
  const card = $("card");
  card.textContent = PALETTE[q.word][0]; card.style.color = PALETTE[q.ink][1];
  card.classList.remove("punch", "shake"); void card.offsetWidth; card.classList.add("punch");
  shownAt = performance.now(); locked = false;
}

function answer(i) {
  if (state !== "playing" || locked || !q || i >= PALETTE.length) return;
  resolve(i === q.answer, (performance.now() - shownAt) / 1000);
}

// 정답 / 오답 / 시간 초과 처리
function resolve(ok, rt) {
  locked = true;
  if (ok) {
    correct++; combo++; rtSum += rt;
    score += scoreFor(combo, rt);
    level = Math.min(MAX_LEVEL, 1 + Math.floor(correct / PER_LEVEL));
  } else {
    wrong++; combo = 0; timeLeft = Math.max(.01, timeLeft - PENALTY);
    const card = $("card"); card.classList.remove("punch", "shake"); void card.offsetWidth; card.classList.add("shake");
    try { navigator.vibrate && navigator.vibrate(60); } catch (e) {}
  }
  const fb = $("fb"); fb.textContent = ok ? "O" : "X"; fb.style.color = ok ? "var(--good)" : "var(--bad)";
  fb.classList.remove("pop"); void fb.offsetWidth; fb.classList.add("pop");
  hud();
  setTimeout(() => { if (state === "playing") ask(); }, FEEDBACK_DELAY);
}

function hud() {
  const r = Math.max(0, Math.min(1, timeLeft / ROUND));
  const bar = $("bar"); bar.style.transform = `scaleX(${r})`; bar.style.background = r > .2 ? "var(--good)" : "var(--bad)";
  $("score").textContent = score.toLocaleString();
}

function end() {
  state = "result"; locked = true;
  const isNew = score > best && score > 0;
  if (isNew) { best = score; try { localStorage.setItem("stroop.best", best); } catch (e) {} }
  const total = correct + wrong;
  const acc = total ? Math.round(correct / total * 100) : 0;
  $("cheer").textContent = acc >= 90 ? "아주 잘하셨어요!" : acc >= 70 ? "잘하셨어요!" : "꾸준히 하면 좋아져요!";
  $("rScore").textContent = score.toLocaleString();
  $("rBest").innerHTML = isNew ? '<span class="newbest">최고 점수 달성!</span>' : `최고 점수 ${best.toLocaleString()}`;
  $("rStats").innerHTML = [
    ["맞힌 문제", `${correct}개`],
    ["정확도", `${acc}%`],
    ["평균 속도", correct ? `${(rtSum / correct).toFixed(1)}초` : "-"],
  ].map(([k, v]) => `<div><span>${k}</span><span>${v}</span></div>`).join("");
  show("result");
}

// ─── 전체화면: 빈 곳 클릭 → 진입, 뒤로가기(또는 Esc) → 해제 ───
const fsEl = () => document.fullscreenElement || document.webkitFullscreenElement;
function enterFullscreen() {
  const el = document.documentElement, req = el.requestFullscreen || el.webkitRequestFullscreen;
  if (!req || fsEl()) return;
  // 전체화면 진입 시 히스토리를 하나 쌓아서, 뒤로가기가 페이지 이탈 대신 전체화면 해제가 되도록
  const pushed = () => { try { history.pushState({ stroopFs: true }, ""); } catch (e) {} };
  try { const p = req.call(el); p && p.then ? p.then(pushed, () => {}) : pushed(); } catch (e) {}
}
function exitFullscreen() {
  const exit = document.exitFullscreen || document.webkitExitFullscreen;
  if (!fsEl() || !exit) return;
  try { const p = exit.call(document); p && p.catch && p.catch(() => {}); } catch (e) {}
}
document.addEventListener("click", e => { if (!e.target.closest("button")) enterFullscreen(); });
window.addEventListener("popstate", () => { if (fsEl()) exitFullscreen(); });
function onFsChange() {
  // Esc 등 다른 방법으로 해제됐으면 쌓아둔 히스토리를 정리
  if (!fsEl() && history.state && history.state.stroopFs) history.back();
}
document.addEventListener("fullscreenchange", onFsChange);
document.addEventListener("webkitfullscreenchange", onFsChange);

$("startBtn").addEventListener("click", start);
$("retryBtn").addEventListener("click", start);
$("homeBtn").addEventListener("click", renderTitle);
renderTitle();
</script>
</body>
</html>
